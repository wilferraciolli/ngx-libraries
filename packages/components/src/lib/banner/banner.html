<div class="Banner">
  @for (message of messages(); track $index) {
    <div
      class="Banner-item"
      [class.is-info]="message.type === 'info'"
      [class.is-warning]="message.type === 'warning'"
      [class.is-error]="message.type === 'error'"
      [attr.role]="message.type === 'info' ? 'status' : 'alert'"
    >
      <span class="Banner-icon" aria-hidden="true">
        @switch (message.type) {
          @case ('info') {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path
                d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"
              />
            </svg>
          }
          @case ('warning') {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M1 21h22L12 2zm12-3h-2v-2h2zm0-4h-2v-4h2z" />
            </svg>
          }
          @case ('error') {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z" />
            </svg>
          }
        }
      </span>
      <span class="Banner-text">{{ message.text }}</span>
    </div>
  }
</div>
