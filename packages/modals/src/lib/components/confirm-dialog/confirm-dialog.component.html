@if (data.title) {
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>
    <p class="ConfirmDialog-message">{{ data.message }}</p>
  </mat-dialog-content>
} @else {
  <h2 mat-dialog-title class="ConfirmDialog-message">{{ data.message }}</h2>
}
<mat-dialog-actions align="end">
  @if (data.cancelLabel !== null) {
    <button mat-button type="button" (click)="cancel()" cdkFocusInitial>
      {{ data.cancelLabel ?? 'Cancel' }}
    </button>
  }
  <button
    mat-flat-button
    type="button"
    class="ConfirmDialog-confirm"
    [class.is-danger]="(data.tone ?? 'danger') === 'danger'"
    (click)="confirm()"
  >
    {{ data.confirmLabel ?? 'Discard' }}
  </button>
</mat-dialog-actions>
