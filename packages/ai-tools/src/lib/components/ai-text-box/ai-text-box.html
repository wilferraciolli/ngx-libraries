<div class="ai-text-box">
  <div class="ai-text-box__content">
    <app-ai-sparkle-icon size="18px" class="ai-text-box__icon" />
    <textarea
      class="ai-text-box__input"
      rows="1"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
    ></textarea>
  </div>
</div>
