<mat-form-field class="SelectField" appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ fieldDef().label }}</mat-label>
  <mat-select [formField]="formField()">
    @for (option of fieldDef().options ?? []; track option.value) {
      <mat-option [value]="option.value">{{ option.label }}</mat-option>
    }
  </mat-select>

  @if (fieldDef().hint) {
    <mat-hint>{{ fieldDef().hint }}</mat-hint>
  }

  @for (error of field()().errors(); track error.kind) {
    <mat-error>{{ error.message }}</mat-error>
  }
</mat-form-field>
