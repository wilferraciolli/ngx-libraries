<div class="utc-date-time-custom-field-container">
  <div class="utc-date-time-custom-field-label">
    <label [for]="inputId">{{ label() }}</label>
  </div>

  <!-- Row wrapper holding the two distinct fields -->
  <div class="utc-date-time-custom-field-inputs-wrapper">
    <!-- Date Field Box (70%) -->
    <div class="utc-date-time-custom-field-input-box utc-date-time-custom-field-date-box">
      <input
        class="utc-date-time-custom-field-date-input"
        type="date"
        [value]="localDatePartValue()"
        [attr.aria-invalid]="invalid() ? true : null"
        [attr.aria-describedby]="inputId + '-hint'"
        (input)="onDateInput($any($event.target).value)"
      />
    </div>

    <!-- Time Field Box (30%) -->
    <div class="utc-date-time-custom-field-input-box utc-date-time-custom-field-time-box">
      <input
        class="utc-date-time-custom-field-time-input"
        type="time"
        [value]="localTimePartValue()"
        [attr.aria-invalid]="invalid() ? true : null"
        [attr.aria-describedby]="inputId + '-hint'"
        (input)="onTimeInput($any($event.target).value)"
      />
    </div>
  </div>

  <div class="utc-date-time-custom-field-hint" [id]="inputId + '-hint'">
    {{ effectiveTimeZone() }}@if (offset()) {
    (UTC{{ offset() }})
  }
    @if (value()) {
      · stored as {{ value() }}
    }
  </div>

  @if (notice()) {
    <div class="utc-date-time-custom-field-notice">{{ notice() }}</div>
  }
</div>
