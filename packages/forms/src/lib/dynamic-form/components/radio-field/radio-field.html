<div class="radio-field-label" [id]="labelId">
  {{ fieldDef().label }}@if (field()().required()) {<span aria-hidden="true"> *</span>}
</div>
<mat-radio-group class="radio-field-group" [formField]="field()" [attr.aria-labelledby]="labelId">
  @for (option of fieldDef().options ?? []; track option.value) {
    <mat-radio-button [value]="option.value">{{ option.label }}</mat-radio-button>
  }
</mat-radio-group>
<app-field-subscript [field]="field()" [hint]="fieldDef().hint" />
