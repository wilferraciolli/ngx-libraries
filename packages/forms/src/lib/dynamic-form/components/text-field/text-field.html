<mat-form-field class="TextField" appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ fieldDef().label }}</mat-label>
  <input matInput [type]="fieldDef().type" [formField]="formField()" />

  @if (fieldDef().hint) {
    <mat-hint>{{ fieldDef().hint }}</mat-hint>
  }

  @for (error of field()().errors(); track error.kind) {
    <mat-error>{{ error.message }}</mat-error>
  }
</mat-form-field>
