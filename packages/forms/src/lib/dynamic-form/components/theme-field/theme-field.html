<div class="ThemeField-label" [id]="labelId">
  {{ fieldDef().label }}
  @if (field()().required()) {
    <span aria-hidden="true"> *</span>
  }
</div>
<mat-button-toggle-group
  class="ThemeField-group"
  [formField]="field()"
  [attr.aria-labelledby]="labelId"
>
  @for (choice of choices(); track choice.value) {
    <mat-button-toggle [value]="choice.value" [aria-label]="choice.label">
      <mat-icon aria-hidden="true">{{ choice.icon }}</mat-icon>
    </mat-button-toggle>
  }
</mat-button-toggle-group>
<ngx-field-subscript [field]="field()" [hint]="fieldDef().hint" />
