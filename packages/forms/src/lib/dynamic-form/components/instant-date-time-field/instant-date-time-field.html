<div class="instant-date-time-field-label">
  {{ fieldDef().label }}@if (state().required()) {<span aria-hidden="true"> *</span>}
</div>

<div class="instant-date-time-field-row">
  <mat-form-field class="instant-date-time-field-date" appearance="outline" subscriptSizing="dynamic">
    <mat-label>Date</mat-label>
    <input
      matInput
      [matDatepicker]="datepicker"
      [value]="date()"
      [min]="minDate()"
      [max]="maxDate()"
      [disabled]="state().disabled()"
      (blur)="state().markAsTouched()"
      (dateChange)="onDateChange($event.value)"
    />
    <mat-datepicker-toggle matIconSuffix [for]="datepicker" />
    <mat-datepicker #datepicker (closed)="state().markAsTouched()" />
  </mat-form-field>

  <mat-form-field class="instant-date-time-field-time" appearance="outline" subscriptSizing="dynamic">
    <mat-label>Time</mat-label>
    <input
      matInput
      [matTimepicker]="timepicker"
      [value]="time()"
      [disabled]="state().disabled()"
      (blur)="state().markAsTouched()"
      (valueChange)="onTimeChange($event)"
    />
    <mat-timepicker-toggle matIconSuffix [for]="timepicker" />
    <mat-timepicker #timepicker (closed)="state().markAsTouched()" />
  </mat-form-field>
</div>

<div class="instant-date-time-field-zone">
  {{ timeZone() }}@if (offset()) { (UTC{{ offset() }})}
  @if (state().value()) {
    · stored as {{ state().value() }}
  }
</div>

@if (notice()) {
  <div class="instant-date-time-field-notice">{{ notice() }}</div>
}

<app-field-subscript [field]="field()" [hint]="fieldDef().hint" />
