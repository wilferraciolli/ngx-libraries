<div class="utc-date-time-field-container">
  <div class="utc-date-time-field-label">
    <label [for]="inputId">{{ label() }}</label>
  </div>

  <div class="utc-date-time-field-input-container">
    <input class="utc-date-time-field-input"
           [id]="inputId"
           [type]="fieldType"
           [value]="localValue()"
           [min]="localMin()"
           [max]="localMax()"
           [attr.aria-invalid]="invalid() ? true : null"
           [attr.aria-describedby]="inputId + '-hint'"
           (input)="onLocalInput($any($event.target).value)"
    />
  </div>

  <div class="utc-date-time-field-hint" [id]="inputId + '-hint'">
    {{ effectiveTimeZone() }}@if (offset()) { (UTC{{ offset() }}) }
    @if (value()) {
      · stored as {{ value() }}
    }
  </div>

  @if (notice()) {
    <div class="utc-date-time-field-notice">{{ notice() }}</div>
  }
</div>
