<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NGX Libraries Showcase</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Wiltech Labs favicons, copied from packages/styles/src/logo by `npm run build:logo`. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Browser chrome follows the app's surface colour (neutral tone 98 light / 6 dark). -->
    <meta name="theme-color" content="#f6fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101415" media="(prefers-color-scheme: dark)" />
    <!-- Applies the stored theme before first paint, so nobody sees a light flash while Angular
         boots. ngx-themes' ThemeService (configured in src/main.ts) owns these keys and takes over once
         the app starts; an unknown stored family just matches no selector and falls back. -->
    <script>
      try {
        var family = localStorage.getItem('showcase.theme.family');
        var mode = localStorage.getItem('showcase.theme.mode');
        if (family) document.documentElement.setAttribute('data-theme', family);
        if (mode === 'light' || mode === 'dark') document.documentElement.style.colorScheme = mode;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Material Symbols is the M3 icon set; display=block keeps the ligature name from flashing as text.
         Only the fill axis may vary (outlined, filled); weight 400, grade 0 and size 24 are fixed. Every
         axis at full range was a 4.0 MB font; this is 0.46 MB (docs/ANGULAR_APP_CONVENTIONS.md). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
